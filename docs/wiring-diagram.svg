<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">ESP32 BLE Joystick Mouse - Wiring</text>

  <!-- ESP32 -->
  <rect x="60" y="50" width="200" height="300" rx="10" fill="#1f2937" stroke="#111" stroke-width="2"/>
  <text x="160" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">ESP32 DevKit</text>
  <text x="160" y="100" text-anchor="middle" font-size="11" fill="#cbd5e1">(daya lewat USB-C)</text>

  <g font-size="13" fill="#fff">
    <text x="75" y="135">3V3</text>
    <text x="75" y="185">GND</text>
    <text x="75" y="235">GPIO27 (D27)</text>
    <text x="75" y="285">GPIO34 (D34)</text>
    <text x="75" y="335">GPIO35 (D35)</text>
  </g>

  <!-- Joystick -->
  <rect x="460" y="50" width="200" height="300" rx="10" fill="#1f2937" stroke="#111" stroke-width="2"/>
  <text x="560" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">KY-023 Joystick</text>
  <text x="560" y="100" text-anchor="middle" font-size="11" fill="#cbd5e1">(diberi daya 3,3V)</text>

  <g font-size="13" fill="#fff" text-anchor="end">
    <text x="645" y="135">pin +5V</text>
    <text x="645" y="185">GND</text>
    <text x="645" y="235">SW</text>
    <text x="645" y="285">VRx</text>
    <text x="645" y="335">VRy</text>
  </g>

  <!-- Wires -->
  <g stroke-width="5" stroke-linecap="round">
    <line x1="260" y1="130" x2="460" y2="130" stroke="#7B3FA0"/>
    <line x1="260" y1="180" x2="460" y2="180" stroke="#222222"/>
    <line x1="260" y1="230" x2="460" y2="230" stroke="#E8B800"/>
    <line x1="260" y1="280" x2="460" y2="280" stroke="#1E5FD8"/>
    <line x1="260" y1="330" x2="460" y2="330" stroke="#1E9A4B"/>
  </g>

  <!-- Pin dots -->
  <g fill="#fff" stroke="#111" stroke-width="2">
    <circle cx="260" cy="130" r="6"/><circle cx="260" cy="180" r="6"/><circle cx="260" cy="230" r="6"/><circle cx="260" cy="280" r="6"/><circle cx="260" cy="330" r="6"/>
    <circle cx="460" cy="130" r="6"/><circle cx="460" cy="180" r="6"/><circle cx="460" cy="230" r="6"/><circle cx="460" cy="280" r="6"/><circle cx="460" cy="330" r="6"/>
  </g>

  <!-- Wire labels -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="360" y="120">ungu (lewat rail +)</text>
    <text x="360" y="170">hitam</text>
    <text x="360" y="220">kuning</text>
    <text x="360" y="270">biru</text>
    <text x="360" y="320">hijau</text>
  </g>

  <text x="360" y="385" text-anchor="middle" font-size="12" fill="#444">Pin "+5V" joystick disambung ke 3V3 ESP32 (lewat rail + breadboard).</text>
  <text x="360" y="402" text-anchor="middle" font-size="12" fill="#444">Jangan diberi 5V: pin ADC ESP32 maksimal tahan 3,3V.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
